<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        width: 300px;
        padding: 15px;
        font-family: "Segoe UI", sans-serif;
        text-align: center;
      }
      h2 {
        margin: 0 0 10px 0;
        color: #333;
      }
      .status-box {
        background: #f8f9fa;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 10px;
        border: 1px solid #eee;
      }
      .count {
        font-size: 24px;
        font-weight: bold;
        color: #2563eb;
        display: block;
        margin: 5px 0;
      }
      input {
        width: 90%;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
        transition: 0.2s;
      }
      #startBtn {
        background-color: #2563eb;
        color: white;
      }
      #stopBtn {
        background-color: #dc2626;
        color: white;
        display: none;
      }
      button:hover {
        opacity: 0.9;
      }
      .error {
        color: red;
        font-size: 12px;
        margin-top: 5px;
        display: none;
      }
    </style>
  </head>
  <body>
    <h2>Clueso Clone</h2>

    <div class="status-box">
      <small>Recorded Steps:</small>
      <span id="stepCount" class="count">0</span>
    </div>

    <input
      type="text"
      id="guideTitle"
      placeholder="Guide Title (e.g. Booking Flow)"
    />

    <button id="startBtn">Start New Recording</button>
    <button id="stopBtn">Stop & Save Guide</button>

    <p id="errorMsg" class="error"></p>

    <script src="popup.js"></script>
  </body>
</html>
